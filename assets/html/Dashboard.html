<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – PaaniLink</title>
  <link rel="shortcut icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/Navbar.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Rubik',sans-serif; font-size:10px; background:#f0f4f8; color:#333; }
    .dash-layout { display:flex; min-height:100vh; padding-top:80px; }
    /* Sidebar */
    .sidebar { width:240px; background:#1a3a5c; color:#fff; padding:24px 0; flex-shrink:0; position:fixed; top:80px; left:0; height:calc(100vh - 80px); overflow-y:auto; z-index:50; }
    .sidebar-brand { padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
    .sidebar-brand .role-name { font-size:1.3rem; color:rgba(255,255,255,0.6); margin-top:4px; }
    .sidebar-brand .user-name { font-size:1.6rem; font-weight:700; }
    .sidebar-nav { padding:16px 0; }
    .sidebar-nav a { display:flex; align-items:center; gap:10px; padding:12px 20px; color:rgba(255,255,255,0.8); text-decoration:none; font-size:1.4rem; transition:all 0.2s; }
    .sidebar-nav a:hover { background:rgba(255,255,255,0.1); color:#fff; }
    .sidebar-nav a.active { background:#FFA500; color:#fff; }
    .sidebar-nav .sep { padding:8px 20px; font-size:1.1rem; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; margin-top:8px; }
    .sidebar-nav a .icon { font-size:1.6rem; }
    /* Main */
    .main-content { flex:1; margin-left:240px; padding:30px; }
    .page-title { font-size:2.4rem; font-weight:700; color:#1a3a5c; margin-bottom:4px; }
    .page-subtitle { font-size:1.4rem; color:#888; margin-bottom:30px; }
    /* Stats */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px; margin-bottom:30px; }
    .stat-card { background:#fff; border-radius:14px; padding:22px; box-shadow:0 3px 12px rgba(0,0,0,0.07); display:flex; flex-direction:column; gap:8px; border-top:4px solid #e0e0e0; }
    .stat-card.orange { border-top-color:#FFA500; }
    .stat-card.blue   { border-top-color:#2980b9; }
    .stat-card.green  { border-top-color:#27ae60; }
    .stat-card.red    { border-top-color:#e74c3c; }
    .stat-card.purple { border-top-color:#8e44ad; }
    .stat-card .s-icon { font-size:2.4rem; }
    .stat-card .s-num  { font-size:3rem; font-weight:700; color:#1a3a5c; line-height:1; }
    .stat-card .s-label{ font-size:1.3rem; color:#888; }
    /* Sections */
    .section { background:#fff; border-radius:14px; padding:24px; box-shadow:0 3px 12px rgba(0,0,0,0.07); margin-bottom:24px; }
    .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
    .section-header h2 { font-size:1.8rem; color:#1a3a5c; font-weight:700; }
    .btn-sm { padding:8px 16px; border:none; border-radius:8px; font-size:1.3rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .btn-orange { background:#FFA500; color:#fff; }
    .btn-orange:hover { background:#e08800; }
    .btn-green  { background:#27ae60; color:#fff; }
    .btn-green:hover  { background:#219a52; }
    .btn-red    { background:#e74c3c; color:#fff; }
    .btn-red:hover    { background:#c0392b; }
    .btn-blue   { background:#2980b9; color:#fff; }
    .btn-blue:hover   { background:#2471a3; }
    .btn-gray   { background:#f0f0f0; color:#333; }
    .btn-gray:hover   { background:#ddd; }
    /* Table */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:1.4rem; }
    thead th { background:#f8f9fa; padding:12px 14px; text-align:left; font-size:1.2rem; font-weight:700; color:#666; text-transform:uppercase; letter-spacing:0.5px; border-bottom:2px solid #e0e0e0; }
    tbody td { padding:12px 14px; border-bottom:1px solid #f0f0f0; color:#444; vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover { background:#fafbfc; }
    /* Badges */
    .badge { padding:3px 10px; border-radius:20px; font-size:1.1rem; font-weight:700; white-space:nowrap; }
    .b-delivered { background:#d4edda; color:#155724; }
    .b-in_transit { background:#cce5ff; color:#004085; }
    .b-approved   { background:#e2d9f3; color:#6f42c1; }
    .b-assigned   { background:#ffeeba; color:#856404; }
    .b-pending_approval { background:#fff3cd; color:#856404; }
    .b-cancelled  { background:#fee; color:#c0392b; }
    .b-disputed   { background:#f8d7da; color:#721c24; }
    .b-commercial { background:#e3f2fd; color:#1565c0; }
    .b-subsidised { background:#e8f5e9; color:#2e7d32; }
    .b-paid       { background:#d4edda; color:#155724; }
    .b-pending    { background:#fff3cd; color:#856404; }
    /* Quota bar */
    .quota-bar-wrap { margin-bottom:14px; }
    .quota-label { display:flex; justify-content:space-between; font-size:1.3rem; margin-bottom:6px; }
    .quota-bar { height:12px; background:#e0e0e0; border-radius:6px; overflow:hidden; }
    .quota-fill { height:100%; border-radius:6px; background:#FFA500; transition:width 0.4s; }
    .quota-fill.high { background:#e74c3c; }
    /* Loading */
    .loading { text-align:center; padding:30px; font-size:1.5rem; color:#888; }
    /* Subsidy cards */
    .subsidy-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .sub-card { border:2px solid #e0e0e0; border-radius:12px; padding:18px; }
    .sub-card h4 { font-size:1.6rem; color:#1a3a5c; margin-bottom:8px; }
    .sub-card p  { font-size:1.3rem; color:#666; margin-bottom:12px; }
    .sub-card .sub-actions { display:flex; gap:8px; }
    /* Driver trip cards */
    .trip-card { border:2px solid #e0e0e0; border-radius:12px; padding:18px; margin-bottom:14px; }
    .trip-card.active { border-color:#2980b9; background:#f0f8ff; }
    .trip-card h4 { font-size:1.6rem; color:#1a3a5c; margin-bottom:8px; }
    .trip-card p  { font-size:1.3rem; color:#555; margin-bottom:6px; }
    .trip-card .trip-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    /* Responsive */
    @media(max-width:768px) {
      .sidebar { width:100%; height:auto; position:fixed; top:80px; left:-100%; transition:left 0.3s; }
      .sidebar.open { left:0; }
      .main-content { margin-left:0; }
      .mobile-menu-btn { display:block; }
    }
  </style>
</head>
<body>

  <header class="header" data-header style="background:#1a3a5c">
    <div class="container">
      <h1><a href="Index.html" class="logo"><img src="../../logo.png" alt="PaaniLink" style="height:36px;border-radius:8px;vertical-align:middle;"><span id="logo-name" style="color:#FFA500">PaaniLink</span></a></h1>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="headerUserName" style="color:#fff;font-size:1.4rem"></span>
        <a href="#" id="logoutBtn" style="color:#fff;text-decoration:none;font-size:1.4rem;background:rgba(255,255,255,0.15);padding:8px 16px;border-radius:8px;">Logout</a>
      </div>
    </div>
  </header>

  <div class="dash-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="user-name" id="sidebarName">Loading…</div>
        <div class="role-name" id="sidebarRole"></div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- filled by JS based on role -->
      </nav>
    </aside>

    <main class="main-content" id="mainContent">
      <div class="loading">Loading dashboard…</div>
    </main>
  </div>

  <script src="../js/mockApi.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script>
    let currentUser = null;
    const STATUS_LABELS = { pending_approval:'Pending Approval', approved:'Approved', assigned:'Assigned', in_transit:'In Transit', delivered:'Delivered', cancelled:'Cancelled', disputed:'Disputed' };

    mockApi.auth.getCurrentUser().then(async res => {
      if (!res.success) { location.href = 'Login.html'; return; }
      currentUser = res.data;
      document.getElementById('headerUserName').textContent = currentUser.name;
      document.getElementById('sidebarName').textContent    = currentUser.name;
      const roleLabels = { customer:'Customer', zone_officer:'Zone Officer', hydrant_operator:'Hydrant Operator', driver:'Driver', admin:'Administrator' };
      document.getElementById('sidebarRole').textContent = roleLabels[currentUser.role] || currentUser.role;
      buildSidebar(currentUser.role);
      await renderDashboard(currentUser.role);
    });

    function buildSidebar(role) {
      const nav = document.getElementById('sidebarNav');
      const links = {
        admin: [
          ['📊','Overview','#overview'],['📋','All Bookings','#bookings'],['👥','Users','#users'],
          ['🏗️','Hydrants & Tankers','#hydrants'],['📈','Reports','#reports'],['⚙️','Settings','#settings'],
        ],
        zone_officer: [
          ['📋','Zone Bookings','#bookings'],['✅','Approve Bookings','#approve'],['🤝','Subsidy Applications','#subsidy'],['⚠️','Disputes','#disputes'],
        ],
        hydrant_operator: [
          ['📋','Assigned Bookings','#bookings'],['🚛','Tankers','#tankers'],['💧','Quota Status','#quota'],
        ],
        driver: [
          ['🚚','My Trips','#trips'],
        ],
        customer: [
          ['📋','My Bookings','#my'],['➕','Book Tanker','BookTanker.html'],['🤝','Apply Subsidy','SubsidyApply.html'],
        ],
      };
      const myLinks = links[role] || links.customer;
      nav.innerHTML = myLinks.map(([icon, label, href]) =>
        `<a href="${href}" class="dash-link"><span class="icon">${icon}</span>${label}</a>`
      ).join('') + `<div style="margin-top:auto"><a href="#" id="sidebarLogout"><span class="icon">🚪</span>Logout</a></div>`;
      document.getElementById('sidebarLogout').addEventListener('click', async (e) => {
        e.preventDefault(); await mockApi.auth.logout(); location.href = 'Login.html';
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault(); await mockApi.auth.logout(); location.href = 'Login.html';
    });

    async function renderDashboard(role) {
      const main = document.getElementById('mainContent');
      if (role === 'admin')             await renderAdmin(main);
      else if (role === 'zone_officer') await renderZoneOfficer(main);
      else if (role === 'hydrant_operator') await renderHydrantOperator(main);
      else if (role === 'driver')       await renderDriver(main);
      else                              await renderCustomerDash(main);
    }

    // ─── ADMIN ─────────────────────────────────────────────────────────────
    async function renderAdmin(main) {
      const [statsRes, bookRes, userRes, hydRes] = await Promise.all([
        mockApi.admin.getDashboardStats(),
        mockApi.bookings.getBookings(),
        mockApi.users.getUsers(),
        mockApi.hydrants.getHydrants(),
      ]);
      const s = statsRes.data;
      main.innerHTML = `
        <div class="page-title">🏛️ Admin Dashboard</div>
        <div class="page-subtitle">City-wide overview of PaaniLink operations</div>
        <div class="stats-grid">
          <div class="stat-card orange"><div class="s-icon">📋</div><div class="s-num">${s.totalBookings}</div><div class="s-label">Total Bookings</div></div>
          <div class="stat-card blue">  <div class="s-icon">🚚</div><div class="s-num">${s.activeBookings}</div><div class="s-label">Active Bookings</div></div>
          <div class="stat-card green"> <div class="s-icon">✅</div><div class="s-num">${s.deliveredBookings}</div><div class="s-label">Delivered</div></div>
          <div class="stat-card red">   <div class="s-icon">⚠️</div><div class="s-num">${s.pendingApprovals}</div><div class="s-label">Pending Approval</div></div>
          <div class="stat-card purple"><div class="s-icon">👥</div><div class="s-num">${s.totalCustomers}</div><div class="s-label">Customers</div></div>
          <div class="stat-card green"> <div class="s-icon">💰</div><div class="s-num">Rs ${s.totalRevenue.toLocaleString()}</div><div class="s-label">Total Revenue</div></div>
        </div>

        <div class="section">
          <div class="section-header"><h2>💧 Hydrant Quota Utilisation</h2></div>
          <div id="quotaBars"></div>
        </div>

        <div class="section">
          <div class="section-header"><h2>📋 All Bookings</h2><div style="display:flex;gap:8px"><select id="adminStatusFilter" onchange="adminFilterBookings()" style="padding:8px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1.3rem"><option value="">All Status</option><option value="pending_approval">Pending Approval</option><option value="approved">Approved</option><option value="assigned">Assigned</option><option value="in_transit">In Transit</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option><option value="disputed">Disputed</option></select></div></div>
          <div class="table-wrap" id="adminBookingsTable"></div>
        </div>

        <div class="section">
          <div class="section-header"><h2>🤝 Pending Subsidy Applications</h2></div>
          <div id="subsidySection"></div>
        </div>`;

      // Quota bars
      const qb = document.getElementById('quotaBars');
      qb.innerHTML = s.quotaUtilisation.map(h => `
        <div class="quota-bar-wrap">
          <div class="quota-label"><span>${h.name}</span><span>${h.pctUsed}% used</span></div>
          <div class="quota-bar"><div class="quota-fill ${h.pctUsed > 80 ? 'high' : ''}" style="width:${h.pctUsed}%"></div></div>
        </div>`).join('');

      // Bookings table
      window._adminBookings = bookRes.data || [];
      adminFilterBookings();

      // Subsidy apps
      const pendingSubs = (userRes.data || []).filter(u => u.subsidyStatus === 'pending');
      const ss = document.getElementById('subsidySection');
      if (!pendingSubs.length) { ss.innerHTML = '<p style="font-size:1.4rem;color:#888">No pending applications.</p>'; }
      else {
        ss.innerHTML = `<div class="subsidy-cards">${pendingSubs.map(u => `
          <div class="sub-card">
            <h4>${u.name}</h4>
            <p>CNIC: ${u.cnic}<br>Phone: ${u.phone}<br>Zone: ${u.zone || 'N/A'}</p>
            <div class="sub-actions">
              <button class="btn-sm btn-green"  onclick="updateSubsidy('${u.id}','approved')">✅ Approve</button>
              <button class="btn-sm btn-red"    onclick="updateSubsidy('${u.id}','none')">❌ Reject</button>
            </div>
          </div>`).join('')}</div>`;
      }
    }

    function adminFilterBookings() {
      const filter = document.getElementById('adminStatusFilter')?.value || '';
      let list = window._adminBookings || [];
      if (filter) list = list.filter(b => b.status === filter);
      const tbl = document.getElementById('adminBookingsTable');
      if (!tbl) return;
      tbl.innerHTML = `<table>
        <thead><tr><th>ID</th><th>Type</th><th>Customer</th><th>Hydrant</th><th>Amount</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead>
        <tbody>${list.map(b => `<tr>
          <td><b>#${b.id}</b></td>
          <td><span class="badge b-${b.type}">${b.type}</span></td>
          <td>${b.customerId}</td>
          <td>${b.hydrantId}</td>
          <td>Rs ${b.amount.toLocaleString()}</td>
          <td><span class="badge b-${b.status}">${STATUS_LABELS[b.status]||b.status}</span></td>
          <td><span class="badge b-${b.paymentStatus}">${b.paymentStatus}</span></td>
          <td>${b.status==='pending_approval'?`<button class="btn-sm btn-green" onclick="approveBooking('${b.id}')">Approve</button>`:''} ${!['cancelled','delivered'].includes(b.status)?`<button class="btn-sm btn-red" onclick="adminCancel('${b.id}')">Cancel</button>`:''}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    // ─── ZONE OFFICER ─────────────────────────────────────────────────────
    async function renderZoneOfficer(main) {
      const [bookRes, userRes] = await Promise.all([
        mockApi.bookings.getBookings({ zoneId: currentUser.zone }),
        mockApi.users.getUsers('customer'),
      ]);
      const bookings = bookRes.data || [];
      const pending  = bookings.filter(b => b.status === 'pending_approval');
      const disputes = bookings.filter(b => b.status === 'disputed');
      const pendingSubs = (userRes.data || []).filter(u => u.subsidyStatus === 'pending');

      main.innerHTML = `
        <div class="page-title">👮 Zone Officer Dashboard</div>
        <div class="page-subtitle">Manage bookings and subsidy approvals for your zone</div>
        <div class="stats-grid">
          <div class="stat-card orange"><div class="s-icon">📋</div><div class="s-num">${bookings.length}</div><div class="s-label">Zone Bookings</div></div>
          <div class="stat-card red">   <div class="s-icon">⏳</div><div class="s-num">${pending.length}</div><div class="s-label">Pending Approval</div></div>
          <div class="stat-card purple"><div class="s-icon">🤝</div><div class="s-num">${pendingSubs.length}</div><div class="s-label">Subsidy Applications</div></div>
          <div class="stat-card blue">  <div class="s-icon">🚨</div><div class="s-num">${disputes.length}</div><div class="s-label">Active Disputes</div></div>
        </div>

        <div class="section">
          <div class="section-header"><h2>⏳ Bookings Pending Approval</h2></div>
          <div class="table-wrap">${bookingTable(pending, true)}</div>
        </div>

        <div class="section">
          <div class="section-header"><h2>🤝 Subsidy Applications</h2></div>
          <div id="subsidyCardsZO">${pendingSubs.length ? `<div class="subsidy-cards">${pendingSubs.map(u => `
            <div class="sub-card">
              <h4>${u.name}</h4>
              <p>CNIC: ${u.cnic}<br>Phone: ${u.phone}<br>Proof: ${u.subsidyProof || 'N/A'}</p>
              <div class="sub-actions">
                <button class="btn-sm btn-green" onclick="updateSubsidy('${u.id}','approved')">✅ Approve</button>
                <button class="btn-sm btn-red"   onclick="updateSubsidy('${u.id}','none')">❌ Reject</button>
              </div>
            </div>`).join('')}</div>` : '<p style="font-size:1.4rem;color:#888">No pending applications.</p>'}</div>
        </div>

        <div class="section">
          <div class="section-header"><h2>🚨 Disputes</h2></div>
          <div class="table-wrap">${bookingTable(disputes, false)}</div>
        </div>

        <div class="section">
          <div class="section-header"><h2>📋 All Zone Bookings</h2></div>
          <div class="table-wrap">${bookingTable(bookings, false)}</div>
        </div>`;
    }

    // ─── HYDRANT OPERATOR ─────────────────────────────────────────────────
    async function renderHydrantOperator(main) {
      const hydrantId = currentUser.hydrantId;
      const [bookRes, hRes, tRes] = await Promise.all([
        mockApi.bookings.getBookings({ hydrantId }),
        mockApi.hydrants.getHydrantById(hydrantId),
        mockApi.tankers.getTankers(hydrantId),
      ]);
      const bookings = bookRes.data || [];
      const hydrant  = hRes.data;
      const tankers  = tRes.data || [];
      const pending  = bookings.filter(b => ['approved'].includes(b.status));
      const active   = bookings.filter(b => ['assigned','in_transit'].includes(b.status));

      const pct = hydrant ? Math.round((1 - hydrant.remainingQuota / hydrant.dailyQuotaGallons) * 100) : 0;

      main.innerHTML = `
        <div class="page-title">🏗️ Hydrant Operator Dashboard</div>
        <div class="page-subtitle">${hydrant ? hydrant.name : 'Your Hydrant'} — Manage dispatch and tankers</div>
        <div class="stats-grid">
          <div class="stat-card orange"><div class="s-icon">✅</div><div class="s-num">${pending.length}</div><div class="s-label">Ready to Assign</div></div>
          <div class="stat-card blue">  <div class="s-icon">🚚</div><div class="s-num">${active.length}</div><div class="s-label">En Route</div></div>
          <div class="stat-card green"> <div class="s-icon">🚛</div><div class="s-num">${tankers.filter(t=>t.available).length}/${tankers.length}</div><div class="s-label">Tankers Available</div></div>
        </div>

        ${hydrant ? `<div class="section">
          <div class="section-header"><h2>💧 Daily Quota</h2></div>
          <div class="quota-bar-wrap">
            <div class="quota-label"><span>${hydrant.name} — Hours: ${hydrant.operatingHoursStart}–${hydrant.operatingHoursEnd}</span><span>${pct}% used (${hydrant.remainingQuota.toLocaleString()} gal remaining)</span></div>
            <div class="quota-bar"><div class="quota-fill ${pct>80?'high':''}" style="width:${pct}%"></div></div>
          </div>
        </div>` : ''}

        <div class="section">
          <div class="section-header"><h2>📋 Approved Bookings – Ready to Assign</h2></div>
          <div class="table-wrap" id="assignTable">${assignTable(pending, tankers)}</div>
        </div>

        <div class="section">
          <div class="section-header"><h2>🚚 Active Deliveries</h2></div>
          <div class="table-wrap">${bookingTable(active, false)}</div>
        </div>

        <div class="section">
          <div class="section-header"><h2>🚛 Tanker Fleet</h2></div>
          <div class="table-wrap"><table>
            <thead><tr><th>Reg No</th><th>Capacity</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>${tankers.map(t => `<tr>
              <td>${t.registrationNo}</td>
              <td>${t.capacityGallons.toLocaleString()} gal</td>
              <td><span class="badge ${t.available?'b-approved':'b-cancelled'}">${t.available?'Available':'Unavailable'}</span></td>
              <td><button class="btn-sm ${t.available?'btn-red':'btn-green'}" onclick="toggleTanker('${t.id}',${!t.available})">${t.available?'Mark Unavailable':'Mark Available'}</button></td>
            </tr>`).join('')}</tbody>
          </table></div>
        </div>`;
      window._pendingBookings = pending;
      window._tankers = tankers;
    }

    function assignTable(bookings, tankers) {
      if (!bookings.length) return '<p style="font-size:1.4rem;color:#888">No bookings ready to assign.</p>';
      const availTankers = tankers.filter(t => t.available);
      return `<table>
        <thead><tr><th>Booking ID</th><th>Type</th><th>Customer</th><th>Address</th><th>Scheduled</th><th>Assign Tanker</th><th>Action</th></tr></thead>
        <tbody>${bookings.map(b => `<tr>
          <td>#${b.id}</td>
          <td><span class="badge b-${b.type}">${b.type}</span></td>
          <td>${b.customerId}</td>
          <td>${b.deliveryAddress}</td>
          <td>${new Date(b.scheduledDate).toLocaleDateString()}</td>
          <td><select id="ts-${b.id}" style="padding:6px;border:1px solid #ddd;border-radius:6px;font-size:1.3rem">
            <option value="">-- Tanker --</option>
            ${availTankers.map(t=>`<option value="${t.id}">${t.registrationNo} (${t.capacityGallons}gal)</option>`).join('')}
          </select></td>
          <td><button class="btn-sm btn-orange" onclick="assignTanker('${b.id}')">Assign & Dispatch</button></td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    async function assignTanker(bookingId) {
      const tankerId = document.getElementById('ts-' + bookingId)?.value;
      if (!tankerId) { alert('Select a tanker first.'); return; }
      const dRes = await mockApi.drivers.getDrivers();
      const availDriver = dRes.data.find(d => d.available);
      const driverId = availDriver ? availDriver.id : null;
      await mockApi.bookings.updateBookingStatus(bookingId, 'in_transit', { tankerId, driverId });
      await mockApi.tankers.updateTankerAvailability(tankerId, false);
      if (availDriver) await mockApi.drivers.updateDriverTrip(availDriver.id, 'start');
      alert('Tanker assigned and dispatched!');
      await renderDashboard(currentUser.role);
    }

    async function toggleTanker(id, available) {
      await mockApi.tankers.updateTankerAvailability(id, available);
      await renderDashboard(currentUser.role);
    }

    // ─── DRIVER ───────────────────────────────────────────────────────────
    async function renderDriver(main) {
      const dRes = await mockApi.drivers.getDrivers();
      const myDriver = dRes.data.find(d => d.userId === currentUser.id);
      if (!myDriver) { main.innerHTML = '<div class="loading">Driver profile not found.</div>'; return; }

      const bRes = await mockApi.bookings.getBookings({ driverId: myDriver.id });
      const trips = bRes.data || [];
      const active = trips.filter(b => ['assigned','in_transit'].includes(b.status));
      const past   = trips.filter(b => ['delivered','cancelled'].includes(b.status));

      main.innerHTML = `
        <div class="page-title">🚛 Driver Dashboard</div>
        <div class="page-subtitle">Manage your delivery trips</div>
        <div class="stats-grid">
          <div class="stat-card blue">  <div class="s-icon">🚚</div><div class="s-num">${active.length}</div><div class="s-label">Active Trips</div></div>
          <div class="stat-card green"> <div class="s-icon">✅</div><div class="s-num">${past.filter(b=>b.status==='delivered').length}</div><div class="s-label">Completed</div></div>
          <div class="stat-card orange"><div class="s-icon">🚛</div><div class="s-num">${myDriver.available?'Available':'On Trip'}</div><div class="s-label">Status</div></div>
        </div>

        <div class="section">
          <div class="section-header"><h2>🚚 Active Trips</h2></div>
          ${active.length ? active.map(b => tripCardHTML(b, myDriver)).join('') : '<p style="font-size:1.4rem;color:#888">No active trips.</p>'}
        </div>

        <div class="section">
          <div class="section-header"><h2>📋 Past Trips</h2></div>
          <div class="table-wrap">${bookingTable(past, false)}</div>
        </div>`;
      window._myDriver = myDriver;
    }

    function tripCardHTML(b, driver) {
      return `<div class="trip-card active">
        <h4>Trip #${b.id}</h4>
        <p>📍 Deliver to: <strong>${b.deliveryAddress}</strong></p>
        <p>📅 Scheduled: ${new Date(b.scheduledDate).toLocaleDateString()}</p>
        <p>🚛 Tanker: ${b.tankerId || 'TBD'}</p>
        <p>💰 Amount: Rs ${b.amount.toLocaleString()}</p>
        <div class="trip-actions">
          ${b.status==='assigned' ? `<button class="btn-sm btn-blue" onclick="markTrip('${b.id}','in_transit','${driver.id}')">▶ Start Trip</button>` : ''}
          ${b.status==='in_transit' ? `<button class="btn-sm btn-green" onclick="markTrip('${b.id}','delivered','${driver.id}')">✅ Mark Delivered</button>` : ''}
          ${b.status==='in_transit' ? `<button class="btn-sm btn-red"   onclick="markTripFailed('${b.id}','${driver.id}')">❌ Mark Failed</button>` : ''}
        </div>
      </div>`;
    }

    async function markTrip(bookingId, status, driverId) {
      await mockApi.bookings.updateBookingStatus(bookingId, status);
      if (status === 'delivered') {
        await mockApi.tankers.updateTankerAvailability(window._myDriver.assignedTankerId, true);
        await mockApi.drivers.updateDriverTrip(driverId, 'end');
      }
      await renderDashboard(currentUser.role);
    }

    async function markTripFailed(bookingId, driverId) {
      const reason = prompt('Reason for failure (e.g. house locked, road blocked):');
      if (!reason) return;
      await mockApi.bookings.updateBookingStatus(bookingId, 'cancelled', { notes: reason });
      await mockApi.drivers.updateDriverTrip(driverId, 'end');
      await renderDashboard(currentUser.role);
    }

    // ─── CUSTOMER ─────────────────────────────────────────────────────────
    async function renderCustomerDash(main) {
      location.href = 'MyBookings.html';
    }

    // ─── SHARED HELPERS ───────────────────────────────────────────────────
    function bookingTable(bookings, showApprove) {
      if (!bookings.length) return '<p style="font-size:1.4rem;color:#888">No bookings.</p>';
      return `<table>
        <thead><tr><th>ID</th><th>Type</th><th>Address</th><th>Amount</th><th>Scheduled</th><th>Status</th>${showApprove?'<th>Action</th>':''}</tr></thead>
        <tbody>${bookings.map(b => `<tr>
          <td>#${b.id}</td>
          <td><span class="badge b-${b.type}">${b.type}</span></td>
          <td>${b.deliveryAddress}</td>
          <td>Rs ${b.amount.toLocaleString()}</td>
          <td>${new Date(b.scheduledDate).toLocaleDateString()}</td>
          <td><span class="badge b-${b.status}">${STATUS_LABELS[b.status]||b.status}</span></td>
          ${showApprove?`<td><button class="btn-sm btn-green" onclick="approveBooking('${b.id}')">✅ Approve</button> <button class="btn-sm btn-red" onclick="rejectBooking('${b.id}')">❌ Reject</button></td>`:''}
        </tr>`).join('')}</tbody>
      </table>`;
    }

    async function approveBooking(id) {
      await mockApi.bookings.updateBookingStatus(id, 'approved');
      await renderDashboard(currentUser.role);
    }
    async function rejectBooking(id) {
      await mockApi.bookings.cancelBooking(id);
      await renderDashboard(currentUser.role);
    }
    async function adminCancel(id) {
      if (!confirm('Cancel this booking?')) return;
      await mockApi.bookings.cancelBooking(id);
      await renderDashboard(currentUser.role);
    }
    async function updateSubsidy(userId, status) {
      await mockApi.users.updateSubsidyStatus(userId, status);
      await renderDashboard(currentUser.role);
      alert(status === 'approved' ? 'Subsidy approved!' : 'Application rejected.');
    }
  </script>
</body>
</html>
