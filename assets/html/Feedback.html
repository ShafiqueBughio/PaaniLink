<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback – PaaniLink</title>
  <link rel="shortcut icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/Feedback.css">
  <link rel="stylesheet" href="../css/Navbar.css">
  <style>
    .page-wrap { max-width:620px; margin:120px auto 60px; padding:0 20px; }
    .card { background:#fff; border-radius:16px; padding:36px; box-shadow:0 6px 24px rgba(0,0,0,0.09); }
    .card h2 { font-size:2.4rem; color:#1a3a5c; margin-bottom:8px; }
    .card .sub { font-size:1.4rem; color:#666; margin-bottom:28px; }
    .form-group { margin-bottom:20px; }
    .form-group label { display:block; font-weight:600; color:#333; margin-bottom:7px; font-size:1.4rem; }
    .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px 16px; border:2px solid #e0e0e0; border-radius:8px; font-size:1.5rem; font-family:inherit; transition:border-color 0.3s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#FFA500; outline:none; }
    .btn-submit { width:100%; padding:14px; background:#FFA500; color:#fff; border:none; border-radius:8px; font-size:1.6rem; font-weight:700; cursor:pointer; }
    .btn-submit:hover { background:#e08800; }
    .stars { display:flex; gap:8px; font-size:3rem; cursor:pointer; margin-bottom:8px; }
    .star { color:#ddd; transition:color 0.1s; user-select:none; }
    .star.active { color:#FFA500; }
    .alert-ok { background:#d4edda; color:#155724; border:1px solid #c3e6cb; border-radius:8px; padding:12px 16px; font-size:1.4rem; display:none; }
  </style>
</head>
<body>

  <header class="header" data-header style="background:#1a3a5c">
    <div class="container">
      <h1><a href="Index.html" class="logo"><img src="../../logo.png" alt="PaaniLink" style="height:36px;border-radius:8px;vertical-align:middle;"><span id="logo-name" style="color:#FFA500">PaaniLink</span></a></h1>
      <a href="Index.html" style="color:#fff;text-decoration:none;font-size:1.4rem">← Home</a>
    </div>
  </header>

  <div class="page-wrap">
    <div class="card">
      <h2>💬 Share Your Feedback</h2>
      <p class="sub">Help us improve PaaniLink services. Your feedback matters!</p>

      <div class="alert-ok" id="okMsg">✅ Thank you for your feedback! We appreciate it.</div>

      <form id="feedbackForm">
        <div class="form-group">
          <label for="fbName">Your Name <span style="color:red">*</span></label>
          <input type="text" id="fbName" placeholder="e.g. Ayesha Siddiqui" required>
        </div>
        <div class="form-group">
          <label for="fbEmail">Email <span style="color:red">*</span></label>
          <input type="email" id="fbEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="fbBooking">Booking ID (optional)</label>
          <input type="text" id="fbBooking" placeholder="e.g. b1234abc">
        </div>
        <div class="form-group">
          <label>Overall Rating</label>
          <div class="stars" id="stars">
            <span class="star" data-val="1">★</span>
            <span class="star" data-val="2">★</span>
            <span class="star" data-val="3">★</span>
            <span class="star" data-val="4">★</span>
            <span class="star" data-val="5">★</span>
          </div>
        </div>
        <div class="form-group">
          <label for="fbCategory">Feedback Category</label>
          <select id="fbCategory">
            <option value="delivery">Delivery Experience</option>
            <option value="driver">Driver Behaviour</option>
            <option value="water_quality">Water Quality</option>
            <option value="app">App / Website</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fbMessage">Your Message <span style="color:red">*</span></label>
          <textarea id="fbMessage" rows="4" placeholder="Describe your experience…" required></textarea>
        </div>
        <button type="submit" class="btn-submit">Submit Feedback</button>
      </form>
    </div>
  </div>

  <script>
    let selectedRating = 0;
    document.querySelectorAll('.star').forEach(star => {
      star.addEventListener('mouseover', () => {
        document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', s.dataset.val <= star.dataset.val));
      });
      star.addEventListener('mouseout', () => {
        document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', s.dataset.val <= selectedRating));
      });
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.dataset.val);
        document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', s.dataset.val <= selectedRating));
      });
    });

    document.getElementById('feedbackForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('okMsg').style.display = 'block';
      document.getElementById('feedbackForm').style.display = 'none';
      setTimeout(() => { location.href = 'Index.html'; }, 2000);
    });
  </script>
</body>
</html>
